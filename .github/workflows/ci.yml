name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp-gateway
    steps:
      - name: Checkout gateway
        uses: actions/checkout@v5
        with:
          path: mcp-gateway

      # Gateway PRs often land with a matching branch on mcp-execution-engine.
      # Try that first so CI does not race engine main; fall back to main.
      - name: Checkout execution engine (matching PR branch)
        if: github.event_name == 'pull_request'
        id: engine_pr_branch
        continue-on-error: true
        uses: actions/checkout@v5
        with:
          repository: feelyourprotocol/mcp-execution-engine
          ref: ${{ github.head_ref }}
          path: mcp-execution-engine

      - name: Checkout execution engine (main)
        if: github.event_name != 'pull_request' || steps.engine_pr_branch.outcome != 'success'
        uses: actions/checkout@v5
        with:
          repository: feelyourprotocol/mcp-execution-engine
          ref: main
          path: mcp-execution-engine

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mcp-gateway/package-lock.json

      - name: Install and build execution engine
        working-directory: mcp-execution-engine
        run: |
          npm ci
          npm run build

      - name: Install gateway dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm run test:ci

      - name: Lint and format
        run: npm run lf:ci

      - name: Build
        run: npm run build
